# Base configuration. Hardware-specific settings live ONLY in configs/profiles/*.yaml
# (the `hw` block) and are merged on top of this file via --profile.
# Override any key from the CLI with --set key=value (OmegaConf dotlist).

seed: 1234

paths:
  data_dir: data                      # all stage outputs live under here
  work_dir: runs                      # checkpoints, logs
  # Local model directories (copied onto the air-gapped network by hand).
  base_model: ???                     # the model directory: set per machine in configs/profiles/
  tokenizer: ${paths.base_model}
  scorer_model: ${paths.base_model}

io:
  shard_size: 50000                   # records per output shard
  gzip: false                         # write *.jsonl.gz instead of *.jsonl

corpus:
  input_glob: "**/*.md"               # MinerU markdown files
  sample_frac: null                   # keep this share of documents (hash of seed + path)
  lang:                               # per-paragraph ko | en | mixed | other
    dominant: 0.8                     # share of letters needed for ko / en
    mixed_min: 0.1                    # min share of each of ko and en for mixed
    hangul_weight: 2.0                # a Hangul syllable counts as this many letters

chunk:                                # `ocrfix chunk`: markdown -> masked chunks (llm.protect)
  min_tokens: 512                     # a chunk ends at the best break in [min, max] tokens,
  max_tokens: 768                     # counted on the masked text with paths.tokenizer
  workers: null                       # processes; null = every CPU core
  shard_bytes: 33554432               # input markdown per shard (32 MB); one worker per shard

scorer:                               # batch/seq-len/memory settings: hw.scorer (profile)
  shard_size: 4096                    # paragraphs tokenized + scored + written per step
  tau: 10.0                           # spike_frac = share of scored tokens above tau bits
  tau_candidates: [6, 8, 10, 12, 14, 16]   # also written as spike_frac@<tau> for calibrate
  # When this file exists (`ocrfix calibrate` output), its tau replaces `tau` and every row
  # gets `flag` (the per-language rule). null = never.
  calibration: ${paths.data_dir}/calibration/calibration.yaml
  passthrough: [corruption, error_rate, variant, src_para_id, stratum, cer]  # copied if present
  # Text is scored masked like the LLM input (llm.protect): math/tables/protected runs are
  # placeholders. These prose tokens after each placeholder (and after a split) aren't scored.
  boundary: 2
  window:                             # consecutive paragraphs of a document share a sequence
    target_tokens: 512                # a window closes once it holds this many tokens
    max_tokens: 768                   # never more; longer paragraphs are cut at a sentence end
  min_scored_tokens: 10               # fewer -> low_confidence: true, never flagged

gold:                                 # human annotation: `ocrfix gold sample|import`
  sample:
    score_key: spike_frac             # scores.jsonl field the tertiles are taken over
    per_lang: {ko: 300, en: 300, mixed: 100, other: 0}
    tertiles: {low: 0.4, mid: 0.3, high: 0.3}   # share of each per_lang quota
    features:                         # fixed quotas, filled first (any language)
      inline_math: 40
      display_math: 30
      table: 30
      garbled_hangul: 40              # short operator-free math span next to Hangul
      mixed_koen: 40                  # ko and en each >= corpus.lang.mixed_min of prose
      hyphenated: 30                  # "exam-\nple" / "exam- ple" in prose
    max_per_doc: 8
    garbled_max_len: 8                # max chars inside a "garbled Hangul" math span
  # Page image per paragraph, or null. Fields: {doc_id} {para_id} {order} {source_path}
  # {source_stem} {source_dir}, e.g. /data/pages/{source_stem}.png
  page_image: null
  label_studio:
    image_url_prefix: ""              # e.g. /data/local-files/?d= for local file serving
  validate:
    length_ratio: [0.8, 1.25]         # len(gold) / len(source)
    ratio_min_chars: 20               # shorter sources skip the ratio check
  split:
    seed: ${seed}
    eval_frac: 0.5                    # by document
  chunks:                             # `ocrfix gold chunks`: ocr/ + truth/ .md pairs -> chunk gold
    split:                            # by document; the rest is sft; split.json pins documents
      seed: ${seed}
      eval: 0.2                       # measurement only, never trained on
      dpo: 0.2                        # DPO prompts the SFT model hasn't seen

errors:                               # `ocrfix errors table`
  max_ngram: 3
  header_footer_min_chars: 8          # dropped runs this long (or page numbers) = header/footer
  confusion_max_len: 4                # longer substitutions count as "other"
  top_k: 50                           # char_confusion pairs listed

calibrate:                            # `ocrfix calibrate`
  target_recall: 0.9                  # on corrupted paragraphs (see recall_on)
  max_false_flag: 0.05                # share of clean paragraphs flagged
  recall_on: [table]                  # corruption labels recall counts on; [] = all corrupted
  min_rows: 50                        # clean and corrupted rows a language needs for its own rule
  max_thresholds: 200                 # spike_frac candidates tried in the two-feature search
  gold_noisy_cer: 0.0                 # gold source with cer above this is "noisy"

corrupt:                              # `ocrfix corrupt` (rates come from errors table)
  rate_scale: 1.0                     # multiplies every sampled per-paragraph rate
  match_total: true                   # scale the histogram draw to the table's total rate
  variants_per_para: 2                # default for --n-variants
  line_width: [50, 90]                # chars per simulated line (hyphen_wrap boundaries)
  hyphen_space_prob: 0.5              # "pro- posed" instead of "pro-\nposed"
  ligature_glyph_prob: 0.5            # fi -> ﬁ; otherwise the ligature is dropped
  dup_word_prob: 0.25                 # duplicated_char repeats a word instead of a char
  garbled_wrap_prob: 0.5              # $...$ wrap when the confusion map has no raw forms
  page_number_prob: 0.5               # header_footer_insert is a bare page number
  header_phrases:
    en: ["Journal of Applied Research", "Proceedings of the Conference", "Vol. 12, No. 3"]
    ko: ["한국정보과학회 논문지", "제 12 권 제 3 호", "정보처리학회논문지"]
  junk: ["~", "·", "|", "^", "¬"]

data:                                 # `ocrfix data sft|dpo|stats` (masking: llm.protect)
  seed: ${seed}
  val_frac: 0.02                      # by document
  # put "<think>\n\n</think>\n\n" before each answer in the data. Not needed for Qwen3.5: with
  # llm.enable_thinking=false its chat template adds that block itself (and strips one from the
  # content first, so true and false render the same tokens). `train` checks either way.
  empty_think: false
  exclude_split: ${paths.data_dir}/gold/split.json   # its eval_docs never become training data
  chunk:                              # paragraphs per example (consecutive, same document)
    sizes: [1, 2, 3]
    weights: [0.5, 0.3, 0.2]
    max_chars: 6000                   # input + target chars per chunk
  sft:
    mix: {synthetic: 0.6, verified: 0.15, gold: 0.1, identity: 0.15}
    total: null                       # null = as many as the mix allows without reuse
    gold_repeats: 3
    verified_min_bpc_gain: 0.1        # stricter than verify.min_bpc_gain
    lang_balance: {ko: 0.5, en: 0.4, mixed: 0.1}   # null = keep each source's own mix
  dpo:
    n_samples: 4                      # completions sampled per input (0 = constructed only)
    temperature: 0.8
    top_p: 0.95
    model: null                       # served model / adapter name; null = llm.served_model_name
    max_pairs_per_input: 4
    constructed: [unchanged, half_fixed, marker_dropped, gap_filled]

train:                                # `ocrfix train sft|dpo|merge` (hardware: hw.train)
  effective_batch: 32                 # sequences per optimizer step; grad accumulation derived
  lr: 1.0e-4
  warmup_ratio: 0.03
  scheduler: cosine
  weight_decay: 0.0
  max_grad_norm: 1.0
  group_by_length: true               # unpacked runs: batch similar lengths (less padding)
  eval_frac: 0.02                     # held-out slice of the training file when no --eval file
  max_eval: 500                       # cap on held-out examples
  eval_steps: 200
  save_steps: 500
  logging_steps: 10
  lora:
    r: 32
    alpha: 64
    dropout: 0.05
    # attention + MLP; Qwen3.5's Gated DeltaNet layers: in_proj_qkv/z/a/b, out_proj
    target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj,
                     in_proj_qkv, in_proj_z, out_proj]
  sft:
    epochs: 2
  dpo:
    epochs: 1
    lr: 5.0e-6
    beta: 0.1
    loss_type: sigmoid
    # The mode (qlora | lora | full) is hw.train.mode, as for SFT. The SFT result passed to
    # `train dpo` may be a LoRA adapter or a full model dir (full mode needs a full one).
    # reference, LoRA modes (no second weight copy):
    #   base: the adapter disabled = the base model (the full SFT model if that's the base)
    #   sft:  a frozen copy of the SFT adapter (the usual DPO reference)
    # reference, full mode:
    #   sft:  the starting policy (the SFT model); base: paths.base_model as a frozen copy
    reference: base
    precompute_ref: true              # full mode: reference log-probs once, before training
  output_dir: ${paths.work_dir}/train

fix:                                  # `ocrfix fix`: rule-based fixers, per document
  order: [unicode, layout_junk, line_join]     # run order; only `enabled` ones run
  unicode:
    enabled: true
    ligatures: true                   # ﬁ ﬂ ﬀ ﬃ ﬄ -> fi fl ff ffi ffl
    width: true                       # fullwidth ＡＢＣ１２３, ideographic space, halfwidth jamo
    strip_invisible: true             # zero-width, BOM, soft hyphen, bidi marks, control chars
    collapse_spaces: true             # runs of spaces -> one; NBSP -> space; trailing spaces
  # Enable the next two only if `errors table` shows their error types are common
  # (header_footer_insert / newline_in_sentence, hyphen_wrap).
  layout_junk:
    enabled: false
    min_repeats: 3                    # pages (or paragraphs) a header line must repeat on
    max_line_len: 100
    headers: true
    page_numbers: true
    gutters: true                     # line-number gutters
  line_join:
    enabled: false
    wordlist: null                    # word frequency list for de-hyphenation (file path)
    min_count: 1
    dehyphenate: true

llm:                                  # `ocrfix correct` + scripts/serve_vllm.sh
  model: ${paths.base_model}          # served by vLLM (server URLs: hw.infer.urls)
  served_model_name: qwen3.5
  adapter: null                       # LoRA adapter dir, or null (served as adapter_name)
  adapter_name: ocrfix-lora
  enable_thinking: false              # chat_template_kwargs.enable_thinking
  seed: 0                             # decoding is greedy (temperature 0)
  max_tokens_factor: 1.3              # max_tokens = ceil(factor * input_tokens) + extra
  max_tokens_extra: 16
  retries: 3                          # per request, next URL each time
  backoff: 2.0                        # seconds, doubled per retry
  timeout: 600                        # seconds per request
  # Prose runs masked as ⟨P#⟩, like math ⟨M#⟩ and tables ⟨T#⟩, in score, correct, verify and
  # the training data (one rule: corpus/protect.py, PROTECT_PATTERNS). Regex detection:
  #   images     ![alt](path)            code    `inline code` (not fenced blocks)
  #   urls       http(s)://..., www...   emails  name@host.tld
  #   dois       10.NNNN/...             citations  [12], [3, 5-7] (numeric only)
  # Remove a kind to have it scored and corrected like ordinary prose. Changing this list
  # changes the scores: rescore, re-sample gold and recalibrate.
  protect: [images, code, urls, emails, dois, citations]
  chunk:
    max_paragraphs: 16
    max_input_tokens: null            # null = derived from hw.infer.max_model_len
    template_overhead: 64             # chat-template tokens around the messages

refine:                               # `ocrfix refine score|correct` on chunks
  scorer: vllm                        # vllm (POST /v1/completions, prompt_logprobs) | transformers
  score_urls: ${hw.infer.urls}        # servers for scoring...
  correct_urls: ${hw.infer.urls}      # ...and for correction; the same by default
  score_model: ${llm.served_model_name}   # scoring always uses the base model, not the adapter
  generator: vllm                     # who answers correct / dpo requests: vllm (correct_urls) or
                                      # transformers (llm.model [+ llm.adapter] in this process)
  hf:                                 # generator: transformers
    batch_size: 16                    # sequences per generate() call (n samples count each)
    wait: 0.05                        # seconds to collect concurrent requests into a batch
  concurrency: ${hw.infer.client_concurrency}   # requests in flight per kind
  noise:                              # random noise cut out by `refine score` (refine/noise.py)
    remove: true
    # bits per char of a whitespace-separated word, by the word's script (hangul if half its
    # chars are Hangul, else other). A word above `core` starts a noise run, neighbours above
    # `extend` join it; runs of >= min_chars non-space chars are removed (shorter: left to the
    # corrector). Set with vLLM on Qwen3.5-4B, 3,000 test chunks (text far from noise p99.9:
    # Latin 3.7, Hangul 5.8; noise: Latin junk ~6, symbols ~12, garbled Hangul ~14). min_chars
    # 12 -> 20: wrongly removed chars 277 -> 154 (by hand: 1 real false removal left), noise
    # found 74% -> 58%. Check on real chunks, and again after switching models.
    min_chars: 20
    core: {hangul: 8.0, other: 5.0}
    extend: {hangul: 6.0, other: 3.5}
  data:                               # `ocrfix refine data`: chunk SFT examples (refine/data.py);
                                      # also uses data.val_frac, data.empty_think, data.exclude_split
    mix: {synthetic: 0.6, gold: 0.2, identity: 0.2}   # renormalized over the sources given;
                                      # identity: clean chunks returned unchanged
    gold_repeats: 2                   # each gold chunk this many times (SFT only)
    lang_balance: null                # e.g. {ko: 0.5, en: 0.35, mixed: 0.15}; null = as found
    total: null                       # null = as many as the mix allows without reuse
    junk:                             # short junk added to synthetic inputs, dropped in the target
      prob: 0.3                       # share of synthetic chunks that get junk
      max_runs: 3                     # 1..max_runs per chunk
      chars: [3, 30]                  # non-space chars per run (refine score removes >= 20 only)
      own_line: 0.2                   # share of runs inserted as their own paragraph
    lost:                             # words destroyed beyond recovery: garbage in, 〈?〉 out
      prob: 0.1                       # share of synthetic chunks that get lost words
      max_runs: 2                     # 1..max_runs lost stretches per chunk
      two_words: 0.2                  # share of stretches that cover two adjacent words
  dpo:                                # `ocrfix refine dpo` (refine/dpo.py); prompts as refine.data
    model: null                       # served model to sample; null = llm.adapter_name if
                                      # llm.adapter is set, else llm.served_model_name
    n_samples: 4                      # sampled answers per prompt, besides the greedy one
    temperature: 0.8
    top_p: 0.95
    max_pairs: 2                      # rejected answers per prompt (greedy first, then near misses)
    constructed: [unchanged, half_fixed, placeholder_dropped, guessed, overcautious]
                                      # off-policy kinds, in turn (a prompt with a lost word
                                      # tries guessed first)
    constructed_share: 0.25           # of prompts the model always got right: one constructed pair
    max_prompts: {synthetic: null, identity: null}   # per source; null = all

verify:                               # `ocrfix verify`: guardrails on each LLM correction
  length_ratio: [0.8, 1.25]           # len(corrected) / len(source)
  max_edit_ratio: 0.15                # char edit distance / len(source)
  max_script_shift: 0.1               # max change of the Hangul share of prose letters
  gap_fill_max_syllables: 4           # a 〈?〉 may be filled with 1..N Hangul syllables
  min_bpc_gain: 0.0                   # bpc(source) - bpc(corrected) must be >= this
  spike_ratio: 1.0                    # spike_frac(corrected) <= spike_ratio * spike_frac(source)
  rescore_failed: false               # re-score corrections that already failed a text check

eval:                                 # `ocrfix eval`
  baseline: true                      # also score the unchanged source as system "source"
  worst_n: 20                         # worst paragraphs listed per system in report.md
  split_tolerance: 3                  # chars between a predicted and the gold split point
  exact_max_n: 25                     # exact Wilcoxon p up to this many non-zero pairs

# Filled by configs/profiles/<name>.yaml; required.
hw: ???
