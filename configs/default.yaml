# Shared settings. Each step's settings are in configs/stages/<step>.yaml, under a section of
# the same name:
#
#   chunk.yaml      chunk:     chunk size, files, what is masked
#   score.yaml      score:     scoring, noise removal, the calibration file
#   gold.yaml       gold:      gold split, error table options
#   corrupt.yaml    corrupt:   the damage generator
#   calibrate.yaml  calibrate: which scores count as damaged
#   sft.yaml        sft:, train:   SFT data; training settings (train.dpo is in dpo.yaml)
#   dpo.yaml        dpo:, train.dpo:   DPO pairs; DPO training
#   correct.yaml    correct:   the correction model, decoding, checks and re-score
#   eval.yaml       eval:      evaluation
#
# The machine (model path, GPUs, vLLM engines and servers) is configs/profiles/<name>.yaml.
# Order: this file, every stages/*.yaml, the profile, then --set key=value. Each setting lives in
# exactly one file; setting it again elsewhere is an error. `ocrfix config` prints the result.

seed: 1234                            # every random choice (splits, damage, sampling, decoding)
work_dir: runs                        # vLLM logs and training checkpoints

lang:                                 # chunk language: ko | en | mixed | cjk | other
  dominant: 0.8                       # share of letters needed for ko / en
  mixed_min: 0.1                      # min share of each of ko and en for mixed
  hangul_weight: 2.0                  # a Hangul syllable or Han character counts as this many letters
  cjk_min: 0.5                        # Han + kana share for cjk (Chinese, Japanese); below it they
                                      # don't count at all (Hanja in Korean text)

# Set by the profile; required.
model: ???
hw: ???
