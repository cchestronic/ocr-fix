# Smoke run on the test fixtures without a GPU model server: the echo LLM stands in for
# vLLM and every paragraph is "corrected". Needs a scorer model (a real one, or the tiny
# test model: see docs/runbook.md, "Smoke run"):
#   ocrfix pipeline configs/pipeline/smoke.yaml --profile rtx5090 \
#     --set paths.base_model=/path/to/model
input_dir: tests/fixtures/sample_mineru
work_dir: runs/pipeline/smoke
sample_frac: null
gold_eval: tests/fixtures/sample_mineru_gold_eval.jsonl   # `gold import` of the 3 fixture docs (13 paragraphs, one with Tab1e)
correct_all: true
serve: echo
stages: [ingest, score, fix, rescore, correct, verify, eval]
set:
  - scorer.calibration=null
  - hw.infer.base_port=18300           # away from the usual 8000, which may be taken
  - hw.infer.urls=[http://127.0.0.1:18300]
