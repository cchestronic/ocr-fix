# Whole corpus, e.g. on 4x H200:
#   ocrfix pipeline configs/pipeline/full.yaml --profile h200x4
input_dir: /data/mineru
work_dir: runs/pipeline/full
sample_frac: null
gold_eval: data/gold/gold_eval.jsonl
correct_all: false
serve: auto
serve_timeout: 1800
stages: [ingest, score, fix, rescore, correct, verify, eval]
set:
  - llm.model=runs/merged             # the fine-tuned model (`ocrfix train merge` output)
