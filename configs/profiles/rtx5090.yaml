# Single RTX 5090 (32 GB, Blackwell sm_120).
# FlashAttention 2/3 wheels are not reliable on sm_120 -> use PyTorch SDPA.
model: Qwen3.5-4B   # the 4B copied into the project folder (relative = project root)

hw:
  name: rtx5090
  n_gpus: 1
  dtype: bfloat16
  attn_impl: sdpa                     # transformers attn_implementation
  vllm_attention_backend: FLASHINFER  # vllm serve --attention-backend

  train:
    mode: qlora                       # qlora | lora | full
    per_device_batch_size: 2          # micro-batch; accumulation reaches train.effective_batch
    max_seq_len: 2048
    gradient_checkpointing: true
    optim: paged_adamw_8bit           # bitsandbytes
    packing: false                    # packing Qwen3.5 needs fla + causal-conv1d
    distributed: none                 # none | ddp | fsdp (auto: lora -> ddp, full -> fsdp)

  infer:                              # vLLM: `ocrfix serve` starts the engines, score/correct use them
    engines: 1                        # one per GPU (GPU i -> port base_port + i)
    tensor_parallel_size: 1
    gpu_memory_utilization: 0.90
    max_model_len: 4096
    max_num_seqs: 64
    host: 127.0.0.1                   # the engines listen here: 127.0.0.1 = this machine only;
                                      # the LAN address to serve other machines
    base_port: 8100                   # engine i listens on base_port + i (8000 is a web app here)
    correct_port: 8101                # the tuned engine (`serve --correct`), next to the base
    concurrency: 64                   # requests in flight per kind (scoring, correction)
    score_urls: null                  # servers for scoring; null = this machine's engines
    correct_urls: null                # servers for correction; null = the base engines, or the
                                      # tuned ones (correct_port) when correct.model is set

  scorer:
    # Set for the 9B (bf16 weights ~17 GB, ~6k tokens per forward peak ~20 GB); the 4B needs less.
    max_batch_tokens: 6144            # tokens per forward (padded rows*width, or packed)
    logits_chunk: 1024                # tokens per lm_head/cross-entropy chunk (fp32 logits)
