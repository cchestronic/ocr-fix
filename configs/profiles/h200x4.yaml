# 4x H200 (141 GB each, Hopper sm_90).
paths:
  base_model: /models/Qwen3.5-9B   # change here when the 9B is in place

hw:
  name: h200x4
  n_gpus: 4
  dtype: bfloat16
  attn_impl: flash_attention_2
  vllm_attention_backend: FLASH_ATTN   # vllm serve --attention-backend

  train:
    mode: lora                        # qlora | lora | full (--set hw.train.mode=full -> FSDP)
    per_device_batch_size: 8          # micro-batch; accumulation reaches train.effective_batch
    max_seq_len: 8192
    gradient_checkpointing: true
    optim: adamw_torch_fused
    packing: true                     # needs fla + causal-conv1d (checked at train start)
    distributed: auto                 # lora -> ddp, full -> fsdp
    fsdp:                             # used when distributed resolves to fsdp
      sharding: full_shard auto_wrap
      layer_cls: Qwen3_5DecoderLayer

  infer:
    # 9B fits on one H200: replicate (4 engines, one per GPU) rather than shard.
    tensor_parallel_size: 1
    data_parallel_size: 4             # engines, one per GPU, on base_port + i
    gpu_memory_utilization: 0.92
    max_model_len: 8192
    max_num_seqs: 256
    base_port: 8000
    urls: ["http://127.0.0.1:8000", "http://127.0.0.1:8001", "http://127.0.0.1:8002", "http://127.0.0.1:8003"]
    client_concurrency: 512           # requests in flight (all engines together)

  scorer:
    max_seq_len: 8192
    max_batch_tokens: 32768
    logits_chunk: 4096
    tokenize_workers: 6               # per rank (4 ranks)
