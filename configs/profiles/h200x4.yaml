# =============================================================================================
# Profile h200x4: one server with 4x H200 (141 GB each, Hopper sm_90), the 9B model.
# =============================================================================================
# Every setting is explained in rtx5090.yaml; h200x8.yaml explains the H200 choices. This
# profile is h200x8 with 4 GPUs and the servers on this machine only (127.0.0.1): both
# models share all 4 GPUs (memory 0.44 each, automatic). `./ocrfix serve` starts both.
# Set it once on this server: echo 'export OCRFIX_PROFILE=h200x4' >> ~/.bashrc
# =============================================================================================

model: /models/Qwen3.5-9B

hw:
  name: h200x4
  n_gpus: 4
  dtype: bfloat16
  attn_impl: flash_attention_2
  vllm_attention_backend: FLASH_ATTN

  train:
    # lora -> DDP over 4 GPUs; --set hw.train.mode=full -> FSDP full fine-tune.
    mode: lora
    per_device_batch_size: 8
    max_seq_len: 8192
    gradient_checkpointing: true
    optim: adamw_torch_fused
    # Needs the optional kernels (scripts/install_offline.py --with-kernels).
    packing: true
    distributed: auto
    fsdp:
      sharding: full_shard auto_wrap
      layer_cls: Qwen3_5DecoderLayer

  # ---- model servers (every setting explained in rtx5090.yaml) -------------------------------
  # Both models share all 4 GPUs (memory 0.44 each, automatic): base on ports 8000-8003,
  # trained on 8100-8103, this machine only (127.0.0.1; its LAN address to serve other
  # machines). Start both kinds with one command: ./ocrfix serve
  servers:
    - {model: base, host: 127.0.0.1, gpus: all}
    - {model: trained, host: 127.0.0.1, gpus: all}

  infer:
    gpus_per_engine: 1
    ports: {base: 8000, trained: 8100}
    max_model_len: 8192
    max_num_seqs: 256
    concurrency: null

  scorer:
    max_batch_tokens: 32768
    logits_chunk: 4096
