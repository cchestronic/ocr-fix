# 4x H200 (141 GB each, Hopper sm_90).
model: /models/Qwen3.5-9B   # change here when the 9B is in place

hw:
  name: h200x4
  n_gpus: 4
  dtype: bfloat16
  attn_impl: flash_attention_2
  vllm_attention_backend: FLASH_ATTN   # vllm serve --attention-backend

  train:
    mode: lora                        # qlora | lora | full (--set hw.train.mode=full -> FSDP)
    per_device_batch_size: 8          # micro-batch; accumulation reaches train.effective_batch
    max_seq_len: 8192
    gradient_checkpointing: true
    optim: adamw_torch_fused
    packing: true                     # needs fla + causal-conv1d (checked at train start)
    distributed: auto                 # lora -> ddp, full -> fsdp
    fsdp:                             # used when distributed resolves to fsdp
      sharding: full_shard auto_wrap
      layer_cls: Qwen3_5DecoderLayer

  infer:                              # vLLM: `ocrfix serve` starts the engines, score/correct use them
    engines: 4                        # one per GPU (GPU i -> port base_port + i)
    tensor_parallel_size: 1
    gpu_memory_utilization: 0.92
    max_model_len: 8192
    max_num_seqs: 256
    host: 127.0.0.1                   # the engines listen here: 127.0.0.1 = this machine only;
                                      # the LAN address to serve other machines
    base_port: 8000                   # engine i listens on base_port + i
    correct_port: 8100                # the tuned engines (`serve --correct`), GPU i -> correct_port + i
    concurrency: 512                  # requests in flight per kind (scoring, correction)
    score_urls: null                  # servers for scoring; null = this machine's engines
    correct_urls: null                # servers for correction; null = the base engines, or the
                                      # tuned ones (correct_port) when correct.model is set

  scorer:
    max_batch_tokens: 32768
    logits_chunk: 4096
