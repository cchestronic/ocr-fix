# `ocrfix score`: how surprising each token is to the base model, noise removal, and
# the calibration that turns scores into flags. Servers: the profile (hw.infer.score_urls).

score:
  backend: auto                       # auto: vllm if the profile has servers (engines > 0 or urls),
                                      # else transformers | vllm (the servers) | transformers
                                      # (in this process, one GPU or the CPU)
  tau: 10.0                           # spike_frac = share of scored tokens above tau bits
  tau_candidates: [6, 8, 10, 12, 14, 16]   # also written as spike_frac@<tau> for calibrate
  boundary: 2                         # prose tokens not scored after a placeholder / chunk start
  min_scored_tokens: 10               # fewer -> low_confidence: true, never flagged
  # `ocrfix calibrate` output. When the file exists, its tau replaces `tau` and every chunk gets
  # `flag`. null = no flags (use --set score.calibration=null to score calibration inputs).
  calibration: data/calibration/calibration.yaml
  noise:                              # random noise cut out of the text (stages/noise.py)
    remove: true
    # a whole chunk whose bpc (after the word-level removal below) is above the calibration's
    # noise_chunk threshold for its language (else "*") is dropped as noise (`calibrate` sets it
    # above the highest bpc of real text, clean or damaged); math and tables stay
    whole_chunks: true
    # bits per char of a whitespace-separated word, by the word's script (hangul if half its
    # chars are Hangul, else other). A word above `core` starts a noise run, neighbours above
    # `extend` join it; runs of >= min_chars non-space chars are removed (shorter: left to the
    # corrector). `ocrfix calibrate-noise` fits the three on your gold chunks and rewrites them
    # here (the line below says when, for which model, with what result). Fit again after
    # switching models.
    # set by hand: vLLM, Qwen3.5-4B, generated test chunks
    min_chars: 20
    core: {hangul: 8.0, other: 5.0}
    extend: {hangul: 6.0, other: 3.5}
