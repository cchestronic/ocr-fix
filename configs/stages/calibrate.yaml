# `ocrfix calibrate`: the per-language rule `spike_frac > A or p90 > B or bpc > C` that flags
# damaged chunks, fit on clean vs damaged (`corrupt`) scores. Writes the file that
# score.calibration (score.yaml) points to.

calibrate:
  target_recall: 0.9                  # on damaged chunks (see recall_on)
  max_false_flag: 0.05                # share of clean chunks flagged
  recall_on: [table]                  # corruption labels recall counts on; [] = all damaged
  min_rows: 50                        # clean and damaged rows a language needs for its own rule
  max_thresholds: 200                 # spike_frac candidates tried in the two-feature search
  gold_noisy_cer: 0.0                 # gold source with cer above this is "noisy"
  noise_chunk:                        # whole-chunk noise limit per language (score.noise.whole_chunks)
    # limit = highest bpc of real text + margin (bits per char). `calibrate`: real text = its
    # clean and damaged chunks; `calibrate-noise-chunk`: the gold OCR chunks (use this one)
    margin: 1.0
    deleted_share: 0.5                # gold chunk whose annotator deleted >= this share = noise
    candidates: [0.5, 1.0, 1.5, 2.0, 3.0]  # margins whose corpus drops are reported
    samples: 5                        # corpus chunks shown per 0.5-bpc band
  noise:                              # `ocrfix calibrate-noise` (noise-removal thresholds)
    # real text (everything the truth keeps) that may be removed, as a share of all real text
    max_text_removed: 0.0001          # 1 char in 10,000
    min_chars: [20, 25, 30, 40, 60]   # tried; only long runs are removed
    min_noise_chars: 2000             # fewer inserted noise chars: no result written
    insert_runs: [1, 3]               # junk runs inserted per gold chunk copy
    insert_chars: [20, 60]            # non-space chars per inserted run (only long runs are removed)
