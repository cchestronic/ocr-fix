# `ocrfix correct`: which model corrects, how it decodes, and the checks every
# correction must pass before it is accepted (including the re-score). The same model answers
# `data dpo` prompts and is what `ocrfix serve --correct` serves. Servers: the profile
# (hw.infer.correct_urls).

correct:
  model: null                         # a merged model dir (`train merge` output); null = the base
  adapter: null                       # or a LoRA adapter dir, served on top of the base
  backend: vllm                       # vllm (the servers) | transformers (this process)
  langs: [ko, en, mixed]              # chunk languages to correct; cjk (Chinese / Japanese) and
                                      # other chunks pass through unchanged
  hf:                                 # backend: transformers
    batch_size: 32                    # sequences per generate() call (n samples count each);
                                      # out of memory, a batch is split in half and retried
    wait: 0.05                        # seconds to collect concurrent requests into a batch
  enable_thinking: false              # Qwen3.5 thinking mode (always off for correction)
  max_tokens_factor: 1.3              # max answer tokens = factor x input tokens + extra
  max_tokens_extra: 16
  retries: 3                          # per request, next server each time
  backoff: 2.0                        # seconds, doubled per retry
  timeout: 600                        # seconds per request
  checks:                             # a correction failing any of these is rejected
    length_ratio: [0.8, 1.25]         # len(corrected) / len(source)
    max_edit_ratio: 0.15              # char edit distance / len(source)
    max_script_shift: 0.1             # max change of the Hangul share of prose letters
    gap_fill_max_syllables: 4         # a 〈?〉 of the source may be filled with 1..N syllables
    # re-score: the corrected text is scored again with the base model
    min_bpc_gain: 0.0                 # bpc(source) - bpc(corrected) must be >= this
    spike_ratio: 1.0                  # spike_frac(corrected) <= spike_ratio * spike_frac(source)
    rescore_failed: false             # re-score corrections that already failed a text check
