# =============================================================================================
# reconstruct.yaml: `ocrfix reconstruct <chunks> <out> --source current` (chunks/rebuild.py).
# =============================================================================================
# Puts the chunks back together into .md files, with math, tables and protected text restored.
# With --source current (the corrected text), a document that noise removal left nearly empty
# is not written: it was almost all garbage. It is listed in <out>/dropped_docs.jsonl instead
# (and an older copy in <out> is deleted). A document containing a table is never dropped.
# --source original rebuilds the input byte for byte and drops nothing.
# =============================================================================================

reconstruct:
  # Letters and digits (any script; math and tables count) the corrected document must still
  # have; fewer: dropped. 0 = off.
  min_letters: 300
  # Letters kept / letters in the original document; below this share: dropped (noise removal
  # took more than 90% of it). 0 = off. Both rules apply: either one drops the document.
  min_kept_share: 0.1
